<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <!-- font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Social links profile</title>
</head>
<body>

  <main>
    <article class="card">

      <div class="card__img-wrapper">
          <img class="card__img" src="assets/images/my profile img.png" alt="profile image">
      </div>

      <div class="card__name-and-address">
        <h1 class="card__profile-name">Mahmoud Ahmed</h1>
        <address class="card__address">Cairo, Egypt</address>
      </div>

      <p class="card__bio"><q>Full-Stack Developer.</q></p>

      <ul class="card__list">
        <li class="card__item">
          <a class="card__link" href="https://github.com/promahmoud219">Github</a>
        </li>
        <li class="card__item">
          <a class="card__link" href="https://www.frontendmentor.io/profile/promahmoud219">Frontend Mentor Profile</a>
        </li>
        <li class="card__item">
          <a class="card__link" href="https://www.frontendmentor.io/home">Frontend Mentor Website</a>
        </li>
        <li class="card__item">
          <a class="card__link" href="https://www.linkedin.com/in/pro-david-91148a398/">LinkedIn</a>
        </li>
        <li class="card__item">
          <a class="card__link" href="https://www.youtube.com/@whosajid">My Youtube Channel</a>
        </li>
      </ul>
    </article>
  </main>
 
</body>
</html>
